# Garfenter Cloud - Deploy Clientes to ECR with E2E Test Blocking
# Builds Twenty CRM image, pushes to ECR, and runs smoke E2E tests
# Deployment is blocked if E2E tests fail
name: Deploy Twenty CRM to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: garfenter/clientes
  CLIENTES_URL: https://clientes.garfenter.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      full_image: ${{ steps.tags.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/garfenter-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="${{ github.sha }}"
          SHORT_SHA="${IMAGE_TAG:0:7}"

          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT
          echo "image_tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "full_image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "latest_image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.full_image }}
            ${{ steps.tags.outputs.latest_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output build details
        run: |
          echo "### Twenty CRM Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.tags.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.tags.outputs.full_image }}" >> $GITHUB_STEP_SUMMARY

  # E2E Smoke Tests - BLOCKING STEP
  # Runs critical smoke tests against live clientes.garfenter.com
  # If tests fail, the deployment is considered failed
  e2e-smoke-tests:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: garfenterdreams/garfenter-tests
          path: garfenter-tests
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: garfenter-tests/e2e/package-lock.json

      - name: Install dependencies
        working-directory: garfenter-tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: garfenter-tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for deployment propagation
        run: |
          echo "Waiting 60 seconds for new image to be pulled and deployed..."
          sleep 60

          # Health check before running tests
          echo "Verifying clientes.garfenter.com is accessible..."
          for i in {1..5}; do
            if curl -sf --connect-timeout 10 "${{ env.CLIENTES_URL }}/healthz" > /dev/null 2>&1; then
              echo "Health endpoint is responding"
              break
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done

      - name: Run E2E Smoke Tests
        working-directory: garfenter-tests/e2e
        env:
          CLIENTES_URL: ${{ env.CLIENTES_URL }}
          CI: true
        run: |
          # Run smoke subset: Health Checks + Core functionality tests
          # These are the critical tests that must pass
          npx playwright test tests/products/clientes.spec.ts \
            --project=chromium \
            --grep "Application loads|Health endpoint responds|Shows welcome modal or dashboard|Sidebar navigation is present" \
            --reporter=list,junit \
            --retries=2 \
            --timeout=60000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-clientes-smoke-results
          path: |
            garfenter-tests/e2e/test-results/
            garfenter-tests/e2e/playwright-report/
          retention-days: 7

      - name: E2E Smoke Test Summary
        if: always()
        run: |
          echo "### E2E Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tested URL:** ${{ env.CLIENTES_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build-and-push.outputs.full_image }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Smoke tests verify:" >> $GITHUB_STEP_SUMMARY
          echo "- Application loads correctly" >> $GITHUB_STEP_SUMMARY
          echo "- Health endpoint responds" >> $GITHUB_STEP_SUMMARY
          echo "- Welcome modal or dashboard displays" >> $GITHUB_STEP_SUMMARY
          echo "- Sidebar navigation is present" >> $GITHUB_STEP_SUMMARY

  # This job only runs if all previous jobs succeed
  # It confirms the deployment is complete and verified
  deployment-verified:
    runs-on: ubuntu-latest
    needs: [build-and-push, e2e-smoke-tests]
    if: success()

    steps:
      - name: Deployment Success Summary
        run: |
          echo "### Clientes Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Full Image:** ${{ needs.build-and-push.outputs.full_image }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All E2E smoke tests passed. Deployment verified." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access points:**" >> $GITHUB_STEP_SUMMARY
          echo "- Application: https://clientes.garfenter.com/" >> $GITHUB_STEP_SUMMARY
          echo "- Health: https://clientes.garfenter.com/healthz" >> $GITHUB_STEP_SUMMARY
